  # ---------------------------------------------------------------
  # IoT network gateway — traffic sink for authorized devices
  # ---------------------------------------------------------------
  gateway:
    build:
      context: .
      dockerfile: Dockerfile.gateway
    image: nbaiot-gateway:latest
    container_name: nbaiot-gateway
    networks:
      iot_net:
        ipv4_address: 192.168.100.3
        mac_address: "02:42:C0:A8:64:01"
    restart: unless-stopped
    profiles: [gateway]

  # ---------------------------------------------------------------
  # Quarantine gateway — traffic sink for shadow devices.
  # ---------------------------------------------------------------
  quarantine-gateway:
    image: nbaiot-gateway:latest
    container_name: nbaiot-quarantine-gateway
    networks:
      quarantine_network:
        ipv4_address: 192.168.200.2
        mac_address: "02:42:C0:A8:C8:01"
    restart: unless-stopped
    profiles: [gateway]

  # ---------------------------------------------------------------
  # Identity engine
  # ---------------------------------------------------------------
  identifier:
    build:
      context: .
      dockerfile: Dockerfile.identifier
    image: nbaiot-identifier:latest
    container_name: nbaiot-identifier
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - ./output:/output
    networks:
      iot_net:
        ipv4_address: 192.168.100.2
        mac_address: "02:42:C0:A8:64:02"
      quarantine_network:
        ipv4_address: 192.168.200.3
    restart: unless-stopped
    profiles: [identity]
