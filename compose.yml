# ================================================================
# compose.yml - N-BaIoT IoT Botnet Detection Pipeline
#
# USAGE
#   Authorized benign pipeline:   docker compose --profile devices up
#   Authorized attack pipeline:   docker compose --profile devices -e MODE=attack up
#   Full infrastructure stack:    docker compose --profile gateway --profile identity up -d
#   Shadow (rogue) device:        docker compose --profile shadow up
#
# NETWORKS
#   iot_net            192.168.100.0/24  - authorized devices only
#   quarantine_network 192.168.200.0/24  - isolated subnet for shadow/rogue devices
# ================================================================

name: nbaiot-pipeline

networks:
  iot_net:
    driver: bridge
    ipam:
      config:
        - subnet: 192.168.100.0/24
          gateway: 192.168.100.1

  quarantine_network:
    driver: bridge
    internal: true
    ipam:
      config:
        - subnet: 192.168.200.0/24
          gateway: 192.168.200.1

services:

  # ---------------------------------------------------------------
  # Base image build only — not run directly
  # ---------------------------------------------------------------
  pipeline:
    build:
      context: .
      dockerfile: Dockerfile
    image: nbaiot-pipeline:latest
    environment:
      MODE: ${MODE:-normal}
      DEVICE_ID: ${DEVICE_ID:-1}
      TARGET_IP: 192.168.100.3
    cap_add: [NET_ADMIN, NET_RAW]
    networks:
      iot_net:
    volumes:
      - ./output:/shared
      - ./model:/model:ro
    restart: "no"
    profiles: [build]

  # ---------------------------------------------------------------
  # Authorized devices with real MAC addresses (profile: devices)
  # ---------------------------------------------------------------
  device-1:
    image: nbaiot-pipeline:latest
    environment: { MODE: "${MODE:-normal}", DEVICE_ID: "1", TARGET_IP: "192.168.100.3", RATE: "${RATE:-120}", BURST_SECS: "${BURST_SECS:-6}", GAP_SECS: "${GAP_SECS:-45}", START_DELAY: "${START_DELAY:-0}", PROBE: "${PROBE:-0}" }
    cap_add: [NET_ADMIN, NET_RAW]
    networks:
      iot_net:
        ipv4_address: 192.168.100.11
        mac_address: "54:E6:1B:A3:2F:01"
    volumes: ["./output:/shared", "./model:/model:ro"]
    restart: "no"
    profiles: [devices]

